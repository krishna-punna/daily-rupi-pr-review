# PR review PoC (see docs/pr-review/POC_SPEC.md §13).
# The three check jobs are the results the review engine treats as authoritative; their names must
# match `requiredChecks` in pr-review/review-policy.yml. The app's own CI (ci.yml) is unchanged.
name: PR review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'backend/**'
      - 'docs/requirements/**'
      - 'pr-review/review-policy.yml'
      - '.github/workflows/pr-review.yml'
  # Phase 5 adds pull_request_review (re-evaluate after approvals) and workflow_dispatch.

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and integration tests, with coverage
        run: mvn -B test
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-tests-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 14

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Consumer-contract tests (web frontend, Android sync)
        run: mvn -B test -Pcontract-tests
      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-tests-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: sast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Security scan (SpotBugs + FindSecBugs, security category only)
        run: mvn -B compile spotbugs:check
      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast-reports
          path: |
            backend/target/spotbugsXml.xml
            backend/target/spotbugsSarif.json
          if-no-files-found: warn
          retention-days: 14

  pr-review:
    name: pr-review
    needs: [backend-tests, contract-tests, sast]
    # AI review costs money, so it runs only for demo branches or PRs labelled ai-review.
    # always(): the engine must also see failed checks, not be skipped by them.
    if: >-
      always() &&
      (startsWith(github.head_ref, 'demo/') ||
       contains(github.event.pull_request.labels.*.name, 'ai-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder until the review engine is wired in (Phase 5)
        run: |
          echo "backend-tests:  ${{ needs.backend-tests.result }}"
          echo "contract-tests: ${{ needs.contract-tests.result }}"
          echo "sast:           ${{ needs.sast.result }}"
