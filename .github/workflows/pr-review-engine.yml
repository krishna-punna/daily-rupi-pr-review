# Builds and tests the review engine itself (pr-review/). Separate from pr-review.yml, whose jobs are the
# checks the engine reads about the app; engine-only changes do not need to re-run those.
name: PR review engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'pr-review/**'
      - '.github/workflows/pr-review-engine.yml'
  push:
    branches: [main]
    paths:
      - 'pr-review/**'
      - '.github/workflows/pr-review-engine.yml'

permissions:
  contents: read

concurrency:
  group: pr-review-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pr-review/pom.xml
      - name: Build and test the engine
        run: mvn -B -f pr-review/pom.xml package
      - name: Upload engine test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-test-reports
          path: pr-review/target/surefire-reports/
          retention-days: 7
